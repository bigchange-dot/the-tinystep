<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tiny Step - 비즈니스 영어 교정기</title>
    <meta name="description" content="AI 기반 무료 비즈니스 영어 이메일 교정기. 어색한 콩글리시를 원어민처럼 세련된 비즈니스 영어로 3초 만에 바꿔드립니다.">
    <meta name="keywords" content="영어 이메일 교정, 비즈니스 영어, AI 영어 첨삭, 무료 영작 수정, The Tiny Step">
    
    <style>
        :root { --primary: #4F46E5; --bg: #F3F4F6; --text: #1F2937; }
        
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            flex-direction: column; /* 위에서 아래로 배치 */
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .container { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 30px; /* 푸터와 간격 */
        }

        h1 { 
            font-size: 26px; 
            color: var(--text); 
            margin: 0 0 10px 0; 
            text-align: center; 
            font-weight: 800;
        }

        p.subtitle { 
            color: #6B7280; 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 15px; 
            line-height: 1.5; 
        }
        
        .input-wrapper { position: relative; margin-bottom: 10px; }
        
        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 15px; 
            border: 2px solid #E5E7EB; 
            border-radius: 12px; 
            font-size: 16px; 
            resize: none; 
            box-sizing: border-box; 
            transition: 0.2s; 
            outline: none; 
            font-family: inherit;
            line-height: 1.5;
        }
        
        textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        #charCount { 
            text-align: right; 
            font-size: 13px; 
            color: #9CA3AF; 
            margin-top: 5px; 
            font-weight: 500;
        }

        button { 
            margin-top: 15px; 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: background-color 0.2s; 
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        
        button:hover { background-color: #4338CA; }
        button:disabled { background-color: #D1D5DB; cursor: not-allowed; box-shadow: none; }
        
        #resultArea { 
            margin-top: 30px; 
            display: none; 
            border-top: 1px dashed #E5E7EB; 
            padding-top: 25px; 
        }
        
        .result-label { font-size: 14px; color: #6B7280; margin-bottom: 10px; font-weight: 600; }
        
        .result-box { 
            background-color: #F8FAFC; 
            border: 1px solid #E2E8F0; 
            padding: 20px; 
            border-radius: 12px; 
            white-space: pre-wrap; 
            line-height: 1.6; 
            color: #334155; 
            font-size: 16px;
        }
        
        .loading { 
            text-align: center; 
            display: none; 
            color: #6B7280; 
            margin-top: 20px; 
            font-size: 14px; 
        }

        /* 깔끔한 푸터 스타일 */
        .site-footer {
            width: 100%;
            text-align: center;
            color: #9CA3AF;
            font-size: 13px;
            margin-top: auto; /* 화면 하단 고정 */
        }
        
        .site-footer a {
            color: #6B7280;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.2s;
        }
        
        .site-footer a:hover {
            text-decoration: underline;
            color: #374151;
        }
        
        .divider { color: #E5E7EB; }
    </style>
</head>

<body>

    <div class="container">
        <h1>✨ The Tiny Step</h1>
        <p class="subtitle">어색한 콩글리시, 이제 안녕!<br>AI가 프로페셔널한 비즈니스 영어로 바꿔드려요.</p>
        
        <div class="input-wrapper">
            <textarea id="userInput" maxlength="500" placeholder="교정하고 싶은 영어 문장이나 한글 내용을 여기에 입력하세요..."></textarea>
            <div id="charCount">0 / 500</div>
        </div>

        <button id="sendButton">교정하기</button>

        <div class="loading" id="loading">
            AI가 문장을 다듬고 있습니다... ✍️<br>
            <span style="font-size:12px; color:#9ca3af;">(약 3~5초 소요됩니다)</span>
        </div>

        <div id="resultArea">
            <div class="result-label">교정 결과</div>
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 The Tiny Step. All rights reserved.</p>
        <div style="margin-top: 10px;">
            <a href="/guide.html">User Guide</a>
            <span class="divider">|</span>
            <a href="/privacy.html">Privacy Policy</a>
            <span class="divider">|</span>
            <a href="mailto:chaee1008@gmail.com">Contact</a>
        </div>
    </footer>

    <script>
        const textarea = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const charCounter = document.getElementById('charCount');
        const loading = document.getElementById("loading");
        const resultArea = document.getElementById("resultArea");
        const resultText = document.getElementById("resultText");

        // [중요] 배포된 Functions URL
        const FUNCTION_URL = "https://us-central1-my-blog-ok-260204.cloudfunctions.net/askGemini"; 

        const MAX_CHARS = 500;

        // 글자 수 카운팅
        textarea.addEventListener('input', () => {
            const currentLength = textarea.value.length;
            charCounter.textContent = `${currentLength} / ${MAX_CHARS}`;
            charCounter.style.color = currentLength >= MAX_CHARS ? '#EF4444' : '#9CA3AF';
        });

        // AI 요청 함수
        async function askAI() {
            const input = textarea.value.trim();

            if (!input) { 
                alert("내용을 입력해주세요!"); 
                textarea.focus();
                return; 
            }

            // 로딩 상태 표시
            sendButton.disabled = true;
            sendButton.innerText = "교정 중...";
            loading.style.display = "block";
            resultArea.style.display = "none";

            try {
                // GET 요청으로 데이터 전송
                const response = await fetch(`${FUNCTION_URL}?text=${encodeURIComponent(input)}`);
                
                if (!response.ok) {
                    throw new Error("서버 응답 오류");
                }

                const data = await response.json();
                
                // 결과 표시
                resultText.innerText = data.reply;
                resultArea.style.display = "block";
                
                // 모바일에서 결과 잘 보이게 스크롤 이동
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                console.error(error);
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                // 상태 복구
                sendButton.disabled = false;
                sendButton.innerText = "교정하기";
                loading.style.display = "none";
            }
        }

        // 버튼 클릭 및 엔터키(Ctrl+Enter) 이벤트
        sendButton.addEventListener('click', askAI);
        
        textarea.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                askAI();
            }
        });
    </script>
</body>
</html>
