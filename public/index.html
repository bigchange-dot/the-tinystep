<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5634467403173492"
    crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tiny Step - 영어 표현 도우미</title>
    <meta name="description" content="비즈니스 영어 교정, 여행 영어, 상황별 한줄 영어 표현까지 AI가 도와드립니다.">
    
    <style>
        /* 스타일은 그대로 유지 */
        :root { --primary: #4F46E5; --bg: #F3F4F6; --text: #1F2937; }
        
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .container { 
            background: white; 
            width: 100%; 
            max-width: 600px; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            display: flex; 
            flex-direction: column; 
            margin-bottom: 30px; 
        }

        h1 { 
            font-size: 24px; 
            color: var(--text); 
            margin: 0 0 5px 0; 
            text-align: center; 
            font-weight: 800;
        }
        
        .tabs {
            display: flex;
            background-color: #F3F4F6;
            border-radius: 12px;
            padding: 5px;
            margin: 25px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px; /* 글자 크기 살짝 조정 */
            font-weight: 600;
            color: #6B7280;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .input-wrapper { position: relative; margin-bottom: 10px; }
        
        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 15px; 
            border: 2px solid #E5E7EB; 
            border-radius: 12px; 
            font-size: 16px; 
            resize: none; 
            box-sizing: border-box; 
            transition: 0.2s; 
            outline: none; 
            font-family: inherit;
            line-height: 1.5;
        }
        
        textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button.submit-btn { 
            margin-top: 15px; 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        
        button.submit-btn:hover { background-color: #4338CA; }
        button.submit-btn:disabled { background-color: #D1D5DB; cursor: not-allowed; }
        
        #resultArea { 
            margin-top: 30px; 
            display: none; 
            border-top: 1px dashed #E5E7EB; 
            padding-top: 25px; 
        }
        
        .result-box { 
            background-color: #F8FAFC; 
            border: 1px solid #E2E8F0; 
            padding: 20px; 
            border-radius: 12px; 
            white-space: pre-wrap; 
            line-height: 1.6; 
            color: #334155; 
            font-size: 16px;
        }
        
        .loading { 
            text-align: center; 
            display: none; 
            color: #6B7280; 
            margin-top: 20px; 
            font-size: 14px; 
        }

        .site-footer {
            width: 100%;
            text-align: center;
            color: #9CA3AF;
            font-size: 13px;
            margin-top: auto; 
        }
        .site-footer a { color: #6B7280; text-decoration: none; margin: 0 10px; }
    </style>
</head>

<body>

    <div class="container">
        <h1>✨ The Tiny Step</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="setMode('business')">💼 비즈니스 교정</button>
            <button class="tab-btn" onclick="setMode('travel')">✈️ 여행 영어</button>
            <button class="tab-btn" onclick="setMode('oneliner')">💡 한줄 표현</button>
        </div>
        
        <div class="input-wrapper">
            <textarea id="userInput" maxlength="500" placeholder="교정하고 싶은 영어 이메일이나 문장을 입력하세요..."></textarea>
        </div>

        <button id="sendButton" class="submit-btn">교정하기</button>

        <div class="loading" id="loading">
            AI가 답변을 생각하고 있습니다... 🧠<br>
            <span style="font-size:12px; color:#9ca3af;">(약 3~5초 소요됩니다)</span>
        </div>

        <div id="resultArea">
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 The Tiny Step. All rights reserved.</p>
        <div style="margin-top: 10px;">
            <a href="/guide.html">User Guide</a> | 
            <a href="/privacy.html">Privacy Policy</a> | 
            <a href="mailto:chaee1008@gmail.com">Contact</a>
        </div>
    </footer>

    <script>
        const textarea = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const loading = document.getElementById("loading");
        const resultArea = document.getElementById("resultArea");
        const resultText = document.getElementById("resultText");
        const tabBtns = document.querySelectorAll('.tab-btn');

        // [중요] 아까 찾아두신 진짜 AI 주소로 꼭 바꿔주세요! (run.app 으로 끝나는 주소)
        const FUNCTION_URL = "https://askgemini-mdfanbh2ya-uc.a.run.app"; 

        let currentMode = 'business';

        function setMode(mode) {
            currentMode = mode;
            
            tabBtns.forEach(btn => btn.classList.remove('active'));
            // 클릭된 버튼 찾기 (event.target이 span일 수도 있으므로 closest 사용)
            const targetBtn = event.target.closest('.tab-btn');
            if (targetBtn) targetBtn.classList.add('active');

            if (mode === 'business') {
                textarea.placeholder = "교정하고 싶은 영어 이메일이나 문장을 입력하세요...";
                sendButton.innerText = "교정하기";
            } else if (mode === 'travel') {
                textarea.placeholder = "어떤 상황인가요? (예: 식당에서 물 더 달라고 할 때 / 공항에서 짐 찾을 때)";
                sendButton.innerText = "표현 추천받기";
            } else if (mode === 'oneliner') {
                textarea.placeholder = "느낌이나 키워드를 입력하세요 (예: 힘내, 고마워, 칭찬, 사과)";
                sendButton.innerText = "한줄 표현 찾기";
            }
            
            resultArea.style.display = 'none';
            textarea.value = '';
            textarea.focus();
        }

        async function askAI() {
            const input = textarea.value.trim();

            if (!input) { 
                alert("내용을 입력해주세요!"); 
                textarea.focus();
                return; 
            }

            sendButton.disabled = true;
            loading.style.display = "block";
            resultArea.style.display = "none";

            try {
                // 옵션(mode) 전송
                const response = await fetch(`${FUNCTION_URL}?text=${encodeURIComponent(input)}&option=${currentMode}`);
                const data = await response.json(); 

                if (!response.ok) {
                    if (data.reply) {
                        resultText.innerText = data.reply;
                        resultArea.style.display = "block";
                        return;
                    }
                    throw new Error("서버 응답 오류");
                }
                
                resultText.innerText = data.reply;
                resultArea.style.display = "block";
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                console.error(error);
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                sendButton.disabled = false;
                loading.style.display = "none";
            }
        }

        sendButton.addEventListener('click', askAI);
        
        textarea.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                askAI();
            }
        });
    </script>
</body>
</html>
