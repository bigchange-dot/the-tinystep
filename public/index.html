<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tiny Step - 비즈니스 영어 교정기</title>
    <style>
        :root { --primary: #4F46E5; --bg: #F3F4F6; --text: #1F2937; }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; /* 중앙 정렬 */
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; /* 모바일 여백 */
            box-sizing: border-box;
        }
        .container { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
        }
        h1 { font-size: 24px; color: var(--text); margin: 0 0 8px 0; text-align: center; }
        p.subtitle { color: #6B7280; text-align: center; margin-bottom: 25px; font-size: 15px; line-height: 1.4; }
        
        .input-wrapper { position: relative; margin-bottom: 10px; }
        textarea { 
            width: 100%; 
            height: 140px; 
            padding: 15px; 
            border: 2px solid #E5E7EB; 
            border-radius: 12px; 
            font-size: 16px; 
            resize: none; 
            box-sizing: border-box; 
            transition: 0.2s; 
            outline: none; 
            font-family: inherit;
        }
        textarea:focus { border-color: var(--primary); }
        
        /* 글자 수 카운터 스타일 */
        #charCount { 
            text-align: right; 
            font-size: 13px; 
            color: #9CA3AF; 
            margin-top: 5px; 
            font-weight: 500;
        }

        button { 
            margin-top: 10px; 
            width: 100%; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        button:hover { background-color: #4338CA; }
        button:disabled { background-color: #D1D5DB; cursor: not-allowed; }
        
        #resultArea { margin-top: 25px; display: none; border-top: 1px solid #E5E7EB; padding-top: 20px; }
        .result-label { font-size: 14px; color: #6B7280; margin-bottom: 8px; font-weight: 600; }
        .result-box { 
            background-color: #F9FAFB; 
            border: 1px solid #E5E7EB; 
            padding: 20px; 
            border-radius: 12px; 
            white-space: pre-wrap; 
            line-height: 1.6; 
            color: #374151; 
            font-size: 15px;
        }
        .loading { text-align: center; display: none; color: #6B7280; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<footer style="text-align: center; margin-top: 60px; padding-bottom: 40px; font-size: 13px; color: #888;">
    <p>© 2026 The Tiny Step. All rights reserved.</p>
    <p>
      <a href="/privacy.html" style="color: #888; text-decoration: none; margin-right: 10px;">Privacy Policy</a> | 
      <a href="mailto:[본인 이메일]" style="color: #888; text-decoration: none; margin-left: 10px;">Contact</a>
    </p>
  </footer>
<body>

    <div class="container">
        <h1>✨ The Tiny Step</h1>
        <p class="subtitle">어색한 콩글리시, 이제 안녕!<br>AI가 프로페셔널한 비즈니스 영어로 바꿔드려요.</p>
        
        <div class="input-wrapper">
            <textarea id="userInput" maxlength="500" placeholder="교정하고 싶은 영어 문장을 여기에 입력하세요..."></textarea>
            <div id="charCount">0 / 500</div>
        </div>

        <button id="sendButton">교정하기</button>

        <div class="loading" id="loading">
            AI가 문장을 다듬고 있습니다... ✍️<br>
            <span style="font-size:12px; color:#9ca3af;">(약 3~5초 소요됩니다)</span>
        </div>

        <div id="resultArea">
            <div class="result-label">교정 결과</div>
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <script>
        // 1. 요소 선택
        const textarea = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const charCounter = document.getElementById('charCount');
        const loading = document.getElementById("loading");
        const resultArea = document.getElementById("resultArea");
        const resultText = document.getElementById("resultText");

        // [중요] 배포 후 생성된 Functions URL을 여기에 정확히 넣어주세요!
        // 예: https://asia-northeast3-project-id.cloudfunctions.net/askGemini
        const FUNCTION_URL = "https://us-central1-my-blog-ok-260204.cloudfunctions.net/askGemini"; 

        const MAX_CHARS = 500;

        // 2. 글자 수 제한 및 카운팅 로직
        textarea.addEventListener('input', () => {
            const currentLength = textarea.value.length;
            charCounter.textContent = `${currentLength} / ${MAX_CHARS}`;

            if (currentLength >= MAX_CHARS) {
                charCounter.style.color = '#EF4444'; // 빨간색 경고
            } else {
                charCounter.style.color = '#9CA3AF'; // 기본 회색
            }
        });

        // 3. API 호출 함수
        async function askAI() {
            const input = textarea.value.trim();

            if (!input) { 
                alert("내용을 입력해주세요!"); 
                textarea.focus();
                return; 
            }

            // UI 상태 변경 (로딩 중)
            sendButton.disabled = true;
            sendButton.innerText = "교정 중...";
            loading.style.display = "block";
            resultArea.style.display = "none";

            try {
                // GET 방식 호출 (Query String)
                const response = await fetch(`${FUNCTION_URL}?text=${encodeURIComponent(input)}`);
                
                if (!response.ok) {
                    throw new Error("서버 응답 오류");
                }

                const data = await response.json();
                
                // 결과 표시
                resultText.innerText = data.reply;
                resultArea.style.display = "block";
            } catch (error) {
                console.error(error);
                alert("오류가 발생했습니다. 잠시 후 다시 시도해주세요.\n" + error.message);
            } finally {
                // UI 상태 복구
                sendButton.disabled = false;
                sendButton.innerText = "교정하기";
                loading.style.display = "none";
            }
        }

        // 4. 버튼 클릭 이벤트 연결
        sendButton.addEventListener('click', askAI);
    </script>
</body>
</html>
